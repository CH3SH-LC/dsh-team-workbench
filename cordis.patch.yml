# @local/dsh-team-workbench — bundle patch
#
# 插入工作台行，并在下方配置原生 subagent 容量与深度。
# 不覆盖官方 agent-team-profile 的任何 row：
# 官方 profile 仍然负责 agent-team / tool-agent-team / ui-agent-team 以及
# 它对 tool-subagent* 的禁用决定。
#
# 本插件的新工具统一使用 team_* 前缀，且避开已被官方占用的
# send_message / list_agents / interrupt_agent / spawn_teammate / wait_agent /
# team_task_create / team_task_get / team_task_list / team_task_update。
- insert:
    - id: team-workbench
      name: '@local/dsh-team-workbench'
      config:
        # 单 Host 写者：第二个 Host 进程写同一数据目录时拒绝写入。
        singleWriter: true
        # 容量三层。residentCapacity 计的是 DSH Continuable Activation 名额，
        # 含等待 children 的父成员、inbox 与恢复余量。
        capacity:
          # 5 members × 6 leaves 全展开 = 35 个 child Activation，另留恢复/控制余量。
          hostActivationLimit: 40
          globalLeafLimit: 30
          recoveryReserve: 3
          # 普通根交互会话必须保留的名额，团队不得占满。
          interactiveReserve: 2
          # 每个成员同时可执行的叶子数与累计 attempt 上限（公平额度）。
          perMemberLeaves: 6
          perMemberAttempts: 24
          teamsMaxConcurrent: 3
          # 真实 provider 请求限制；null 表示按账户/模型的真实限额另行配置，
          # 不从 Agent 数量推断。
          providerRequestLimit: null
        # 调度参数（仅影响选择顺序，不影响正确性）。
        scheduler:
          agingPerMinute: 1.5
          maxStartsPerTick: 8
          wakeCoalesceMs: 40
          # 原生 Continuable 池满（ACTIVATION_LIMIT_REACHED）后的退避窗口：
          # 容量满属于「拒绝并保持 ready」，不是失败；但也不能在同一毫秒里反复打原生池。
          capacityCooldownMs: 1500
        # policy：横向拆分语义检查。phaseRelay 必须保持 'reject'。
        policy:
          splitBy: independent-deliverable
          phaseRelay: reject
          requireArtifactVersion: true
          completionGate: acceptance-satisfied
        # 客户端兼容层开关，可停用回滚。
        compat:
          rightBarFocusBridge: true
          rightBarFocusBridgeMinVersion: '0.2.0-rc.2'

# 把原生 Continuable 池放大到与本插件的 residentCapacity 匹配。
#
# DSH 0.2.0-rc.2 接口基线：原生池满会抛 `ACTIVATION_LIMIT_REACHED`。
# 工作台会保留 ready 状态并退避；调整容量时应同时考虑模型服务的实际请求额度。
#
# 本覆盖会影响同一 profile 中的原生 subagent 配置；请按实际安装版本检查其配置字段。
# maxDepth 提到 2：member（深度 1）下面的 leaf（深度 2）才有合法深度；
# 显式传 maxDepth=0 会让每一次 leaf 启动都抛 SubagentDepthError（已实测）。
- id: subagent
  name: '@deepseek-ai/dsh-subagent'
  config:
    maxDepth: 2
    maxActiveSubagents: 40
